<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none" role="img" aria-label="Chakor - your AI, on your hardware">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0f0d"/>
      <stop offset="1" stop-color="#0c1512"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 40) rotate(38) scale(680 460)">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d36b"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>
  <rect x="0" y="417" width="1280" height="3" fill="#22c55e" opacity="0.55"/>

  <!-- raised fist logo -->
  <g transform="translate(96,52) scale(1.15)" fill="url(#green)">
    <rect x="14" y="33" width="20" height="11" rx="4.5"/>
    <rect x="10.5" y="17" width="27" height="18" rx="6"/>
    <rect x="11" y="10" width="5.6" height="12" rx="2.8"/>
    <rect x="17.8" y="8.5" width="5.6" height="13.5" rx="2.8"/>
    <rect x="24.6" y="8.5" width="5.6" height="13.5" rx="2.8"/>
    <rect x="31.4" y="10" width="5.6" height="12" rx="2.8"/>
    <rect x="8" y="22" width="15" height="7.5" rx="3.75" transform="rotate(-18 15 26)"/>
  </g>
  <text x="170" y="92" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3.5" font-weight="700" fill="#5eead4">SELF-HOSTED AI WORKSPACE</text>

  <text x="92" y="214" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="98" font-weight="800" letter-spacing="-3" fill="#f8fafc">Chakor</text>
  <text x="96" y="262" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#22c55e">Your AI, on your hardware.</text>
  <text x="96" y="298" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">No cloud. No tracking. No big tech. Just you and your models.</text>

  <!-- feature pills -->
  <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="96" y="334" width="186" height="36" rx="18" fill="#10231b" stroke="#1f7a47" stroke-opacity="0.6"/>
    <circle cx="118" cy="352" r="4" fill="#22c55e"/>
    <text x="132" y="357" fill="#cbd5e1">Local + cloud models</text>

    <rect x="294" y="334" width="132" height="36" rx="18" fill="#10231b" stroke="#1f7a47" stroke-opacity="0.6"/>
    <circle cx="316" cy="352" r="4" fill="#22c55e"/>
    <text x="330" y="357" fill="#cbd5e1">Web search</text>

    <rect x="438" y="334" width="196" height="36" rx="18" fill="#10231b" stroke="#1f7a47" stroke-opacity="0.6"/>
    <circle cx="460" cy="352" r="4" fill="#22c55e"/>
    <text x="474" y="357" fill="#cbd5e1">Your data stays home</text>
  </g>

  <!-- floating chat card -->
  <g filter="url(#shadow)">
    <rect x="836" y="86" width="352" height="248" rx="22" fill="#0e1a15" stroke="#1f3a2e" stroke-width="1.5"/>
  </g>
  <rect x="836" y="86" width="352" height="6" rx="3" fill="url(#green)"/>
  <!-- window dots -->
  <circle cx="862" cy="116" r="4.5" fill="#ef4444" opacity="0.85"/>
  <circle cx="878" cy="116" r="4.5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="894" cy="116" r="4.5" fill="#22c55e" opacity="0.85"/>
  <!-- model chip -->
  <rect x="1072" y="106" width="96" height="22" rx="11" fill="#14271f"/>
  <circle cx="1086" cy="117" r="3.5" fill="#22c55e"/>
  <rect x="1096" y="114" width="58" height="6" rx="3" fill="#3f6b54"/>

  <!-- assistant bubble -->
  <rect x="860" y="148" width="232" height="66" rx="14" fill="#15211b"/>
  <rect x="878" y="166" width="190" height="7" rx="3.5" fill="#3f5a4d"/>
  <rect x="878" y="182" width="160" height="7" rx="3.5" fill="#3f5a4d"/>
  <rect x="878" y="198" width="118" height="7" rx="3.5" fill="#33493e"/>

  <!-- user bubble (green, right) -->
  <rect x="934" y="226" width="230" height="50" rx="14" fill="url(#green)"/>
  <rect x="952" y="244" width="176" height="7" rx="3.5" fill="#eafff1" opacity="0.95"/>
  <rect x="952" y="258" width="120" height="7" rx="3.5" fill="#eafff1" opacity="0.7"/>

  <!-- input bar -->
  <rect x="860" y="290" width="304" height="32" rx="16" fill="#0b1512" stroke="#274a3a"/>
  <rect x="878" y="303" width="120" height="6" rx="3" fill="#33493e"/>
  <circle cx="1146" cy="306" r="11" fill="url(#green)"/>
  <path d="M1141 306 h9 M1146 301 l5 5 l-5 5" stroke="#06210f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
